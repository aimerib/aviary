# Sorcha calibration pilot. Selected automatically by AVIARY_TARGET=sorcha-v1
# (RunConfig.for_target); the shared pilot.yaml stays the flash config so running
# Sorcha cannot de-authorize the flash burn.
#
#   AVIARY_TARGET=sorcha-v1 just pilot
#
# All four lanes, because sorcha-v1 now declares all four:
#   a — task rollouts in Sorcha's voice. Persona-clean by construction (only a
#       task's `prompt` reaches the teacher; the voice comes from her system
#       prompt at ingest), so the flash task bank is reused as-is.
#   b — fiction extraction. Persona-neutral, and CAPPED (see lane_b_max_books).
#   c — self-play. Inline seeds are `{persona}`-substituted to Sorcha; RP seeds
#       from the designated lane B run are persona-transparent.
#   d — the iMessage export. No teacher calls, so it costs nothing and is the
#       only lane whose volume is fixed rather than dialled (~3.8k records).
kind: pilot
lanes: [a, b, c, d]
eval_param_fraction: 0.15
split_seed: 20260716
dpo_min_margin: 1.0
dedupe_threshold: 0.8
# 40 of 482 books, stratified so the holdout ratio and author mix survive.
#
# Lane B is the only lane whose volume comes from the corpus rather than from
# this file, and until 2026-07-23 there was no cap at all. That was invisible
# while lane B replayed from the response cache; changing the cache key format
# made it live again and the next pilot projected to 27h / ~$111 — to then
# subsample it to the 20 lane C seeds below. Measured 2026-07-23: ~0.3 books/min
# at 8 workers, so 40 books is ~2h and still measures keep rates honestly.
# The burn leaves this at 0 (whole corpus).
lane_b_max_books: 40
lane_a_num_workers: 8   # lane A ran 3/84 batches in 29min at 4; matches burn
lane_a_batch_size: 11
lane_a_max_turns: 12
lane_c:
  # `owner` is the companion side: a deliberately thin persona whose real style
  # arrives per-seed from the vault voice guide. The RP personas stay in the mix
  # because this model has to be a general SillyTavern character too, not only
  # Sorcha — same weights, two jobs.
  conversations_per_seed: 1
  personas: [owner, lazy_texter, engaged_rper, nsfw_rper]
  rng_seed: 20260716
  # 527 companion seeds exist; a pilot samples them on an even stride so the
  # event/person/topic/obsession mix survives. Each seed is a full multi-turn
  # self-play conversation at two teacher calls per turn — uncapped, this is a burn.
  max_companion_seeds: 40
  # Seeds now route to their own personas (companion -> owner, RP -> roleplayers),
  # so the job count is comp*1 + laneb*4 rather than (comp+laneb)*4.
  max_lane_b_seeds: 20

# Lane D generation is free but judging it is not: 1,227 records would be ~50
# minutes of GLM at measured throughput before lanes A/B/C even start.
lane_d_max_records: 150
