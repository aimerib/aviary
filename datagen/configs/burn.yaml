# Full run. `just burn` refuses without a recent pilot manifest whose keep rates sit
# inside the bands below and whose datagen_config_hash matches (cache-discipline rule).
kind: burn
lanes: [a, b, c]
eval_param_fraction: 0.15
split_seed: 20260716
dpo_min_margin: 1.0
dedupe_threshold: 0.8
lane_a_num_workers: 8
lane_a_batch_size: 20
lane_c:
  conversations_per_seed: 3
  personas: [lazy_texter, engaged_rper, nsfw_rper, task_asker]
  rng_seed: 20260716
# Per-lane keep-rate bands. The burn guard checks EACH burn lane against its own
# band using the blessing pilot's per-lane rates, and refuses to burn a lane the
# pilot never measured. Lanes differ by design — don't blend them into one band.
#   verify = structural-verifier pass rate; judge = rubric pass rate among verified.
burn_bands:
  a:  # agentic/Olivia — PROVISIONAL, lane A not yet piloted; tighten after first A pilot
    verify: [0.30, 0.85]
    judge: [0.50, 0.95]
  b:  # fiction extraction — judges LOW by design (thought_quality floor, ~28% observed)
    verify: [0.40, 0.95]
    judge: [0.15, 0.50]
  c:  # self-play RP — PROVISIONAL; set from the first AO3-seeded lane C pilot
    verify: [0.35, 0.95]
    judge: [0.35, 0.90]
burn_max_pilot_age_days: 14
