# Full run. `just burn` refuses without a recent pilot manifest whose keep rates sit
# inside the bands below and whose datagen_config_hash matches (cache-discipline rule).
kind: burn
lanes: [a, b, c]
eval_param_fraction: 0.15
split_seed: 20260716
dpo_min_margin: 1.0
dedupe_threshold: 0.8
lane_a_num_workers: 8
lane_a_batch_size: 20
lane_c:
  conversations_per_seed: 3
  personas: [lazy_texter, engaged_rper, nsfw_rper, task_asker]
  rng_seed: 20260716
# Per-lane keep-rate bands. The burn guard checks EACH burn lane against its own
# band using the blessing pilot's per-lane rates, and refuses to burn a lane the
# pilot never measured. Lanes differ by design — don't blend them into one band.
#   verify = structural-verifier pass rate; judge = rubric pass rate among verified.
burn_bands:
  a:  # agentic/Olivia — calibrated on lanea2/3/4 (verify 0.70/0.92/0.82, judge
      # 0.97/0.94/0.85). Teacher-ceiling decision 2026-07-19: four structural
      # families legitimately pass 0.94-1.00 (see their difficulty_target
      # comments), so the lane verify band reflects the measured mix.
    verify: [0.55, 0.95]
    judge: [0.50, 0.98]
  b:  # fiction extraction — judges LOW by design (thought_quality floor, ~28-32%
      # observed); verify is a structural JSON-parse gate with no difficulty dial,
      # not task pass/fail — consistently ~0.999-1.00 every measurement to date
      # (calibrated on 2026-07-19-pilot-blessing: verify 1.00, judge 0.32).
    verify: [0.40, 1.0]
    judge: [0.15, 0.50]
  c:  # self-play RP — calibrated on 2026-07-19-pilot-lanec-ao3 (verify 0.82, judge 0.93)
    verify: [0.55, 0.95]
    judge: [0.60, 0.98]
  # Lane D (personal; sorcha target only) — INERT for v2.2: lanes above never
  # include d. Provisional band until a real lane D pilot exists.
  d:
    verify: [0.5, 1.0]
    judge: [0.3, 0.98]
burn_max_pilot_age_days: 14
