# Teacher roster. Provenance rule: every id is a pinned DATED snapshot, never `latest`.
#
# !! VERIFY BEFORE FIRST PAID RUN: the ids/wire_models below are the intended roster
# shape with placeholder snapshot dates — confirm each against the provider's current
# dated snapshot list and update pricing.yaml to match. `aviary` will refuse undated ids.
#
# No Claude-class model anywhere (generation OR judging) — user decision 2026-07-16
# (Anthropic ToS risk). Judge policy is cross-vendor: a record is judged by a
# different vendor than the one that generated it.

hermes_pin: v0.18.2

teachers:
  - id: deepseek-v4-flash-20260610
    provider: deepseek
    route: direct
    base_url: https://api.deepseek.com/v1
    wire_model: deepseek-v4-flash-20260610
    api_key_env: DEEPSEEK_API_KEY
    max_concurrency: 8

  - id: deepseek-v4-pro-20260610
    provider: deepseek
    route: direct
    base_url: https://api.deepseek.com/v1
    wire_model: deepseek-v4-pro-20260610
    api_key_env: DEEPSEEK_API_KEY
    max_concurrency: 4

  - id: glm-5-20260430
    provider: zhipu
    route: direct
    base_url: https://api.z.ai/api/paas/v4
    wire_model: glm-5-20260430
    api_key_env: GLM_API_KEY
    api_key_env_fallback: ZAI_API_KEY
    max_concurrency: 6

  - id: kimi-k3-20260522
    provider: moonshot
    route: openrouter
    base_url: https://openrouter.ai/api/v1
    wire_model: moonshotai/kimi-k3-20260522
    api_key_env: OPENROUTER_API_KEY
    max_concurrency: 6

assignments:
  lane_a:
    easy_mid: deepseek-v4-flash-20260610
    hard: deepseek-v4-pro-20260610
  lane_b:
    profiles: deepseek-v4-flash-20260610
    scenes: deepseek-v4-flash-20260610
    dialogue: kimi-k3-20260522        # long-form prose: use a different idiolect than lane A
  lane_c:
    user_sim: glm-5-20260430          # user side ≠ character side, by design
    character: deepseek-v4-pro-20260610
  judge:
    primary: glm-5-20260430
    secondary: kimi-k3-20260522
    tertiary: deepseek-v4-flash-20260610
  harmonizer:
    primary: deepseek-v4-flash-20260610

judge_policy: cross_vendor
