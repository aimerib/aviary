# Teacher roster.
#
# Provenance model (decided 2026-07-17): DeepSeek/GLM/Kimi ship ROLLING model names
# with no dated snapshots, so `id` and `wire_model` are decoupled:
#   * `id`         — an aviary provenance pin `<name>-YYYYMMDD`, date = when we
#                    verified behavior against the live provider. Dated-validated;
#                    keyed by pricing.yaml, recorded in the manifest.
#   * `wire_model` — the provider's real (rolling) name, sent on the wire as-is.
# Rolling names CAN drift under a fixed id; the response cache pins behavior within a
# run, and re-verifying bumps the id date. Verified against live provider docs
# 2026-07-17 (prices in pricing.yaml).
#
# No Claude-class model anywhere (generation OR judging) — user decision 2026-07-16
# (Anthropic ToS risk). Judge policy is cross-vendor: a record is judged by a
# different vendor than the one that generated it.

# hermes release v0.18.2 — upstream tags releases by date; verify_hermes_pin
# compares against `git describe --tags`, so the pin is the date tag.
hermes_pin: v2026.7.7.2

teachers:
  - id: deepseek-v4-flash-20260717   # pin date; wire name is rolling
    provider: deepseek
    route: direct
    base_url: https://api.deepseek.com/v1
    wire_model: deepseek-v4-flash
    api_key_env: DEEPSEEK_API_KEY
    max_concurrency: 8
    json_extra_body: {thinking: {type: disabled}}   # extraction needs direct JSON, not reasoning

  - id: deepseek-v4-pro-20260717
    provider: deepseek
    route: direct
    base_url: https://api.deepseek.com/v1
    wire_model: deepseek-v4-pro
    api_key_env: DEEPSEEK_API_KEY
    # Raised 4 -> 12 (2026-07-22). Lane C workers are min(concurrency) across the
    # lane's models, so pro at 4 capped the whole lane at 4 in-flight conversations
    # — measured 30 calls/min, ~8s/call, entirely latency-bound with zero rate
    # limits. Vendor limits were never the constraint here; our own cap was.
    max_concurrency: 12
    json_extra_body: {thinking: {type: disabled}}   # verified 2026-07-17: thinking-on returns empty content on long scenes

  - id: glm-5.2-20260717
    provider: zhipu
    route: direct
    base_url: https://api.z.ai/api/coding/paas/v4   # coding-plan endpoint (flat $30/mo sub)
    wire_model: glm-5.2
    api_key_env: GLM_API_KEY
    api_key_env_fallback: ZAI_API_KEY
    max_concurrency: 6

  - id: kimi-k3-20260717
    provider: moonshot
    route: openrouter
    base_url: https://openrouter.ai/api/v1
    wire_model: moonshotai/kimi-k3
    api_key_env: OPENROUTER_API_KEY
    max_concurrency: 12
    # Kimi K3 reasons by default and OpenRouter bills/consumes those tokens against
    # max_tokens. Probed live 2026-07-23: an unconstrained call spends ~326 tokens
    # reasoning, so lane C's 300-token user-sim budget returned EMPTY content and
    # 74% of lane C records came out with zero messages. `reasoning.enabled=false`
    # returns real content with 0 reasoning tokens. Same class of failure as
    # DeepSeek's thinking-on empty-content problem above.
    json_extra_body: {reasoning: {enabled: false}}

assignments:
  lane_a:
    easy_mid: deepseek-v4-flash-20260717
    hard: deepseek-v4-pro-20260717
  lane_b:
    profiles: deepseek-v4-flash-20260717
    scenes: deepseek-v4-flash-20260717
    dialogue: deepseek-v4-pro-20260717  # A/B outcome 2026-07-17: kimi too costly/throttled, glm dropped long scenes; pro = reliable + cheap (idiolect overlaps lane A, accepted)
  lane_c:
    # Moved off GLM 2026-07-22. user side ≠ character side is still satisfied
    # (moonshot vs deepseek), but the real reason is load: z.ai served BOTH the
    # user-sim and the judge, and measured 19 rate-limits per 130 calls in the
    # first sorcha pilot. Lane C generation and judging were queueing behind each
    # other on one quota. Kimi rides OpenRouter, a different bucket entirely.
    user_sim: kimi-k3-20260717
    # The character side ROTATES (roster.assigned_pool collects character + character_*).
    #
    # Measured 2026-07-23 on pilot-sorcha7: with deepseek-pro as the only character
    # teacher, 47% of Sorcha's companion turns contained "och" or "aye" and 21%
    # OPENED with one — against a persona brief that says "Down rhythm, never
    # caricature". Every one of her 496 turns came from one model, so its particular
    # reading of "Irish folk to the bone" WAS her voice. Rotation is the structural
    # fix; the corpus averages over two idiolects instead of memorising one.
    #
    # Kimi is deliberately NOT in this pool — it drives the user side, and one vendor
    # playing both halves of a conversation is a model talking to itself. `rotate`
    # enforces that independently via avoid=, this is just belt and braces.
    character: deepseek-v4-pro-20260717
    character_alt: glm-5.2-20260717
  judge:
    # Order is no longer priority — judge_for load-balances across every eligible
    # cross-vendor judge, keyed so a sibling group always lands on one judge.
    primary: glm-5.2-20260717
    secondary: kimi-k3-20260717
    tertiary: deepseek-v4-flash-20260717
  harmonizer:
    primary: deepseek-v4-flash-20260717

judge_policy: cross_vendor
