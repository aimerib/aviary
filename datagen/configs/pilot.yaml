# Burn-shaped blessing pilot: same lanes as burn.yaml so the manifest this run
# writes can authorize the burn (per-lane bands + matching datagen_config_hash).
# Lane A regenerates the full 9-family bank (6 scaled + audit/count/refactor,
# 2026-07-20 corpus-mix expansion); lanes B/C replay mostly from the response
# cache (same books/seeds as the calibration runs).
kind: pilot
lanes: [a, b, c]
eval_param_fraction: 0.15
split_seed: 20260716
dpo_min_margin: 1.0
dedupe_threshold: 0.8
lane_a_num_workers: 4
lane_a_batch_size: 11
lane_a_max_turns: 12
lane_c:
  conversations_per_seed: 1
  personas: [lazy_texter, engaged_rper, nsfw_rper]
  # Each seed draws 2 user-sim personas from its allowed pool (the RP pool is now ~16
  # archetypes). Sampled, not crossed: spreads the whole pool across the corpus at 2
  # conversations/seed instead of 16. Deterministic by seed_id (cache-stable).
  personas_per_seed: 2
  rng_seed: 20260716
