# count-family tool allowlist + schemas, MIRRORING the pinned hermes checkout's
# terminal + file toolsets. Widening this list REQUIRES updating the family's
# verifier fixtures in the same change (CLAUDE.md rule).
family: count
tools:
  - type: function
    function:
      name: write_file
      description: Write a text file, creating parent directories if needed.
      parameters:
        type: object
        properties:
          path: {type: string}
          content: {type: string}
        required: [path, content]
  - type: function
    function:
      name: read_file
      description: Read a text file.
      parameters:
        type: object
        properties:
          path: {type: string}
        required: [path]
  - type: function
    function:
      name: search_files
      description: Search file contents or find files by name (ripgrep-backed).
      parameters:
        type: object
        properties:
          pattern: {type: string}
          target: {type: string, enum: [content, files]}
          path: {type: string}
        required: [pattern]
  - type: function
    function:
      name: terminal
      description: Execute a shell command in the rollout workspace.
      parameters:
        type: object
        properties:
          command: {type: string}
        required: [command]
