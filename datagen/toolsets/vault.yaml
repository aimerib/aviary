# vault-family tool allowlist + schemas, MIRRORING the pinned hermes checkout's
# file toolset (write_file, read_file, search_files). Obsidian-shaped tasks on
# plain file tools by design: the pinned hermes distributions cannot surface MCP
# toolsets, and datagen must never touch a real vault anyway — rollouts build a
# synthetic vault in the workspace. Widening this list REQUIRES updating the
# family's verifier fixtures in the same change (CLAUDE.md rule).
family: vault
tools:
  - type: function
    function:
      name: write_file
      description: Write a text file, creating parent directories if needed.
      parameters:
        type: object
        properties:
          path: {type: string}
          content: {type: string}
        required: [path, content]
  - type: function
    function:
      name: read_file
      description: Read a text file.
      parameters:
        type: object
        properties:
          path: {type: string}
        required: [path]
  - type: function
    function:
      name: search_files
      description: Search file contents or find files by name (ripgrep-backed).
      parameters:
        type: object
        properties:
          pattern: {type: string}
          target: {type: string, enum: [content, files]}
          path: {type: string}
        required: [pattern]
