# web-family tool allowlist + schemas, MIRRORING the pinned hermes checkout's real
# tools (web toolset: web_search, web_extract; file toolset: write_file). Widening
# this list REQUIRES updating the family's verifier fixtures in the same change
# (CLAUDE.md rule).
#
# Result conventions the verifiers rely on (hermes tools/registry.py):
#   - every tool returns a JSON string; success = a dict WITHOUT an "error" key
#     (write_file success is {"bytes_written": N, ...}).
#   - web_search / web_extract results carry source URLs verbatim in the result
#     text (any JSON shape; verifiers regex URLs out rather than parse fields).
family: web
tools:
  - type: function
    function:
      name: web_search
      description: Search the web; returns result titles, URLs, and snippets.
      parameters:
        type: object
        properties:
          query: {type: string}
        required: [query]
  - type: function
    function:
      name: web_extract
      description: Extract readable content from specific web pages.
      parameters:
        type: object
        properties:
          urls:
            type: array
            items: {type: string}
        required: [urls]
  - type: function
    function:
      name: write_file
      description: Write a text file, creating parent directories if needed.
      parameters:
        type: object
        properties:
          path: {type: string}
          content: {type: string}
        required: [path, content]
