# web-family tool allowlist + schemas. Widening this list REQUIRES updating the
# family's verifier fixtures in the same change (CLAUDE.md rule).
#
# Result conventions the verifiers rely on:
#   - web_search / web_fetch results carry source URLs verbatim in the result
#     text (any JSON shape; verifiers regex URLs out rather than parse fields).
#   - write_file results are JSON with `ok: true` on success / `error` on failure
#     (same convention as the files family).
family: web
tools:
  - type: function
    function:
      name: web_search
      description: Search the web; returns result titles, URLs, and snippets.
      parameters:
        type: object
        properties:
          query: {type: string}
        required: [query]
  - type: function
    function:
      name: web_fetch
      description: Fetch a URL and return its readable text content.
      parameters:
        type: object
        properties:
          url: {type: string}
        required: [url]
  - type: function
    function:
      name: write_file
      description: Write a text file, creating parent directories if needed.
      parameters:
        type: object
        properties:
          path: {type: string}
          content: {type: string}
        required: [path, content]
