# terminal-family tool allowlist + schemas, MIRRORING the pinned hermes checkout's
# real tools (terminal toolset: terminal; file toolset: write_file, read_file).
# Widening this list REQUIRES updating the family's verifier fixtures in the same
# change (CLAUDE.md rule).
family: terminal
tools:
  - type: function
    function:
      name: terminal
      description: Execute a shell command in the rollout workspace.
      parameters:
        type: object
        properties:
          command: {type: string}
        required: [command]
  - type: function
    function:
      name: write_file
      description: Write a text file, creating parent directories if needed.
      parameters:
        type: object
        properties:
          path: {type: string}
          content: {type: string}
        required: [path, content]
  - type: function
    function:
      name: read_file
      description: Read a text file.
      parameters:
        type: object
        properties:
          path: {type: string}
        required: [path]
