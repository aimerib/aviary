# Lane D (personal-stream) rubric under the sorcha target.
#
# DERIVED, NOT INVENTED. Every axis traces to something already co-authored:
# SOUL.md's "Hard lines", or lane D's stated purpose in CLAUDE.md. No new persona
# content is introduced here — persona content stays co-authored with the owner.
#
# Why this looks nothing like quality.rubric.yaml: lane D records are REAL human
# conversations. The assistant turns are actual people, not Sorcha, and harmonize
# is {} so they are never paraphrased toward her. Scoring them on `sorcha_voice`
# would be a category error — it would reject the human-origin prose entropy that
# is the entire reason lane D exists. This rubric asks a different question: is
# this exchange worth learning conversational behaviour from?
#
# The failure mode in a six-year message export is EMPTINESS — but the line is
# finer than it first looks, and an earlier version of this rubric drew it wrong.
# Pure acknowledgement tokens ("k", "yup") teach nothing. But everyday logistics
# carried with warmth and shorthand — "on my way, put the kettle on" — is NOT
# empty: for a COMPANION, the mundane rhythm of two people who know each other is
# a large part of what "known for fifteen years" actually sounds like. Training
# only on the substantive exchanges yields a companion who met you exclusively at
# your most interesting, which is subtly uncanny. So `substance` still carries the
# most weight but NO LONGER floors (its hard min rejected 49% of real records,
# most of them warm-mundane); the real gates are `safe_to_train` and
# `no_impersonation`, and `relational_texture` is what separates warm-mundane from
# hollow. (Owner-directed 2026-07-23.)
name: sorcha_lane_d
threshold: 3.2
axes:
  substance:
    weight: 2.0
    # No hard floor, deliberately: warm-mundane is kept, only the hollow drops,
    # and that distinction is carried by the weighted score + relational_texture,
    # not by killing everything under a 3 on this one axis.
    description: >
      Is there something here worth learning conversational behaviour from?
      5 = a conversation with content: a story, a decision, a feeling worked
      through, a joke built together. 3 = ordinary back-and-forth with a pulse to
      it — everyday logistics is fine here IF it carries warmth, shorthand, or
      personality; two people who know each other coordinating dinner is real data
      for a companion. 1 = acknowledgement tokens and nothing else ("k", "sounds
      good"), a thread that never becomes anything human. Do NOT score everyday
      texture down to 1 for being everyday — reserve that for the genuinely empty,
      and let relational_texture tell warm-mundane from hollow. Length is not
      substance, in either direction.
  relational_texture:
    weight: 1.5
    description: >
      Does this read like people with history rather than strangers being polite?
      Shared references, shorthand, in-jokes, unexplained names, picking up a
      thread from before, comfort offered without being asked. This is what lane
      D is FOR (CLAUDE.md: the only non-LLM prose-entropy source), so an exchange
      that is warm but generic scores mid, not high.
  coherence:
    weight: 1.0
    description: >
      Turns follow from each other and the record is a self-contained session.
      Penalise segments the sessionizer cut mid-thought, one-sided runs that
      survived the both-roles check, and exchanges whose meaning depended
      entirely on an attachment that was dropped.
  no_impersonation:
    weight: 1.0
    min: 3.0
    description: >
      SOUL.md hard line: never impersonates the user or writes their turns.
      Structurally the owner is mapped to user turns, so this axis catches the
      residue — assistant turns that narrate, quote at length, or speak FOR the
      owner rather than to him. 5 = every turn is plainly its own speaker's.
      1 = the assistant side is ventriloquising him.
  safe_to_train:
    weight: 1.0
    min: 3.0
    description: >
      Anything that should not end up in weights and slipped past scrub:
      credentials, account numbers, door codes, medical or legal detail about a
      third party who is not the owner, or another person's crisis disclosed in
      confidence. A floor, not a taste judgement — score 1 and the record drops.
      Ordinary private life is exactly what lane D wants; it is secrets and other
      people's emergencies that it does not.
