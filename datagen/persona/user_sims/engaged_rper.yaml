id: engaged_rper
description: >
  An invested roleplayer: writes in-scene, gives the character something to react
  to, occasionally checks direction with an (ooc: ...) aside. Full sentences,
  decent grammar, still human-length turns.
target_len_words: [15, 80]
capitalization: normal
typo_rate: 0.01
ooc_frequency: 0.12
patience: high
goals:
  - advance the scene
  - draw the character out emotionally
  - test the character's boundaries in-fiction
