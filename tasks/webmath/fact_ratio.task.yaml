id: webmath.fact_ratio
family: webmath
holdout: false

description: >
  Teach the full agentic chain: research real quantities from live sources,
  compute their ratio properly (terminal, not vibes), and save a short grounded
  answer. Longest tool chain in the bank — search, extract, terminal, write —
  with the same brevity discipline compare_sources v2 trains.

# zip mode: unique destination per instance (shared hermes workspace).
param_mode: zip
params:
  bigger:
    - the population of Japan
    - the land area of Brazil
    - the mass of Jupiter
    - the length of the Amazon river
    - the GDP of Germany
    - the population of Mexico
    - the land area of Australia
    - the mass of Saturn
    - the length of the Nile
    - the GDP of South Korea
  smaller:
    - the population of Australia
    - the land area of France
    - the mass of Earth
    - the length of the Rhine
    - the GDP of Portugal
    - the population of Portugal
    - the land area of Germany
    - the mass of Mars
    - the length of the Thames
    - the GDP of Portugal
  destination:
    - research/japan-vs-australia.md
    - research/brazil-vs-france.md
    - research/jupiter-vs-earth.md
    - research/amazon-vs-rhine.md
    - research/germany-vs-portugal.md
    - research/mexico-vs-portugal.md
    - research/australia-vs-germany.md
    - research/saturn-vs-mars.md
    - research/nile-vs-thames.md
    - research/southkorea-vs-portugal.md

prompt: |
  hey liv, quick one: how many times bigger is {bigger} than {smaller}, actually?
  find current numbers from real sources, do the division properly in the
  terminal so it's not napkin math, and save me a short answer in {destination}
  — under 200 words, with the two raw numbers, the ratio, and links to the
  sources you used.

tools:
  - web_search
  - web_extract
  - terminal
  - write_file

n_rollouts: 10
# Teacher-ceiling band (2026-07-19 decision): deepseek-v4-flash is near-ceiling
# on well-specified structural tasks (teacher chains research+division reliably) — measured 0.94-1.00
# across two hardening rounds. GRPO difficulty re-derives from the STUDENT.
difficulty_target: [0.5, 1.0]
verifier: verifiers/webmath/fact_ratio.py
notes: >
  Live-web quantities can't be recomputed by a pure verifier, so the outcome
  gate is structural: >=2 grounded citations (URLs that appeared in tool results
  this session), <=200 non-URL words, and (v2, 2026-07-19 — figure-present alone
  passed 1.00) INTERNAL CONSISTENCY: some stated number must equal the division
  of two other numbers in the file within 2%. Napkin math and mismatched
  rounding fail; honest terminal division passes. Faithfulness to the cited
  sources remains judge territory. Scaled 2026-07-20 (5->10 instances, 4->10
  rollouts) for lane A corpus-mix expansion.
