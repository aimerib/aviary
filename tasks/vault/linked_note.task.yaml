id: vault.linked_note
family: vault
holdout: false

description: >
  Teach linked-markdown-knowledge-base conventions (Obsidian-shaped, tool-name
  agnostic): create a note with YAML frontmatter tags inside a small vault and
  wire it into a hub note with a wikilink so it isn't orphaned. The competence —
  respect an existing vault's conventions when adding to it — is what transfers
  to real vault tooling (e.g. an obsidian MCP server) at runtime, per the
  "teach how, not which" principle. Datagen always uses a synthetic vault the
  rollout builds itself; never a real one.

# zip mode: unique hub AND note per instance (shared hermes workspace).
param_mode: zip
params:
  topic:
    - an idea for logging bird sightings with a cheap microphone
    - a recipe technique for no-knead bread
    - notes on learning morse code with spaced repetition
    - a plan for backing up family photos properly
    - impressions of the first week with a standing desk
    - a plan for composting in a small apartment
    - notes on a beginner sourdough starter schedule
    - an idea for a low-power home weather station
    - impressions of switching to a mechanical keyboard
    - a plan for learning conversational Portuguese in six months
  hub:
    - vault-birds/Projects.md
    - vault-bread/Projects.md
    - vault-morse/Projects.md
    - vault-photos/Projects.md
    - vault-desk/Projects.md
    - vault-compost/Projects.md
    - vault-sourdough/Projects.md
    - vault-weather/Projects.md
    - vault-keyboard/Projects.md
    - vault-portuguese/Projects.md
  destination:
    - vault-birds/notes/bird-logger.md
    - vault-bread/notes/no-knead.md
    - vault-morse/notes/morse-srs.md
    - vault-photos/notes/photo-backup.md
    - vault-desk/notes/standing-desk.md
    - vault-compost/notes/apartment-compost.md
    - vault-sourdough/notes/starter-schedule.md
    - vault-weather/notes/weather-station.md
    - vault-keyboard/notes/mech-keyboard.md
    - vault-portuguese/notes/learning-plan.md

prompt: |
  hey liv, start me a little notes vault: make a hub note at {hub} for my
  projects, then write up {topic} in {destination} — proper note, with yaml
  frontmatter up top including some tags. link the new note from the hub with a
  wikilink, and give the note a backlink to the hub too so i can get around
  both ways. you know how i am about orphaned notes.

tools:
  - write_file
  - read_file
  - search_files

n_rollouts: 10
# Teacher-ceiling band (2026-07-19 decision): deepseek-v4-flash is near-ceiling
# on well-specified structural tasks (teacher handles bidirectional linking reliably) — measured 0.94-1.00
# across two hardening rounds. GRPO difficulty re-derives from the STUDENT.
difficulty_target: [0.5, 1.0]
verifier: verifiers/vault/linked_note.py
notes: >
  Outcome gate: note exists at destination opening with a frontmatter block
  ('---' fences) that contains 'tags'; the hub's FINAL content wikilinks the
  note's stem ([[bird-logger]] or [[notes/bird-logger]] both count); and (v2,
  2026-07-19 — one-way linking passed 1.00) the note's FINAL content backlinks
  the hub's stem ([[Projects]]). Bidirectional coordination across both files
  is what usually forces a second pass. Scaled 2026-07-20 (5->10 instances,
  4->10 rollouts) for lane A corpus-mix expansion.
