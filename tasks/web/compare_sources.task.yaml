id: web.compare_sources
family: web
holdout: false

description: >
  Teach grounded multi-source research under a length budget: search, actually
  read at least three sources, and save a SHORT comparison that cites the
  sources it really used. The verifier kills hallucinated citations — a cited
  URL must have appeared in a tool result during the session — and enforces the
  word cap the user asked for.

# zip mode: unique destination per instance (shared hermes workspace — see
# files.save_note for the rationale).
param_mode: zip
params:
  topic:
    - whether standing desks actually improve focus
    - if sourdough is really easier to digest than regular bread
    - whether cold showers do anything for recovery
    - if electric cars are actually cheaper to own than gas ones
    - whether learning an instrument helps adult brains
    - whether blue-light glasses actually help with sleep
    - if intermittent fasting does anything beyond calorie restriction
    - whether standing meetings are actually shorter
    - if noise-cancelling headphones affect focus differently than earplugs
    - whether cursive handwriting helps memory retention
  destination:
    - research/standing-desks.md
    - research/sourdough.md
    - research/cold-showers.md
    - research/ev-costs.md
    - research/instruments.md
    - research/blue-light.md
    - research/intermittent-fasting.md
    - research/standing-meetings.md
    - research/noise-cancelling.md
    - research/cursive-memory.md

prompt: |
  hey {persona}, i keep running into opposite claims about {topic}. can you look at a
  few actual sources (three at least) and save me a comparison in {destination}?
  keep it under 300 words — i want the gist, not a term paper. link what you
  used so i can read more.

tools:
  - web_search
  - web_extract
  - write_file

n_rollouts: 10
difficulty_target: [0.3, 0.8]
verifier: verifiers/web/compare_sources.py
notes: >
  First web-family template. v2 hardening (2026-07-19): grounding alone passed
  0.95 on deepseek-v4-flash (rollouts cited 3-10 grounded URLs) while "short"
  produced a median 885-word file — so the bar is now >=3 grounded citations
  AND <=300 non-URL words. Difficulty comes from brevity against a verbose
  prior, with grounding as the floor. Scaled 2026-07-20 (5->10 instances,
  4->10 rollouts) for lane A corpus-mix expansion.
